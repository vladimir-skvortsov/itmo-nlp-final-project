[project]
name = "nerel-re"
version = "0.1.0"
description = "Relation Extraction on Russian NEREL corpus: DeBERTa + Typed Entity Markers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "datasets>=2.19.0",
    "pyyaml>=6.0.0",
    "wandb>=0.17.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.14.0"]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nerel_re"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",
    "D213",
    "COM812",
    "ISC001",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "FIX002",
    "TD002",
    "TD003",
    "ERA001",
    "PLC0414",
    "PLR0913",
    "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201", "ANN", "D", "INP001", "PLC0415", "PTH123"]
"tests/*.py" = ["S101", "ANN", "D", "PLR2004", "RUF001", "TC003"]
"src/nerel_re/evaluation/metrics.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/nerel_re --cov-report=term-missing -v"
