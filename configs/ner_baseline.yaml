data:
  data_dir: data/nerel/NEREL-v1.1
  max_length: 128

model:
  name: ai-forever/ruBert-base
  dropout: 0.1

training:
  output_dir: output/ner_baseline
  num_epochs: 5
  batch_size: 32
  learning_rate: 2.0e-5
  head_learning_rate: 2.0e-4
  warmup_ratio: 0.06
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  log_every_n_steps: 100
  eval_every_n_epochs: 1
  wandb_project: nerel-ner
  run_name: ner-rubert-baseline
