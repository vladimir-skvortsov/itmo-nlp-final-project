run_name: deberta-typed-markers

data:
  data_dir: data/nerel/NEREL-v1.1
  max_length: 256
  negative_ratio: 3.0

model:
  name: microsoft/mdeberta-v3-base
  use_typed_markers: true
  dropout: 0.1

training:
  output_dir: output/typed_markers
  num_epochs: 10
  batch_size: 16        # smaller batch for larger model
  learning_rate: 1.0e-5
  head_learning_rate: 1.0e-4
  warmup_ratio: 0.06
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  use_weighted_sampler: true
  log_every_n_steps: 50
  eval_every_n_epochs: 1
  wandb_project: nerel-re
  run_name: deberta-typed-markers
